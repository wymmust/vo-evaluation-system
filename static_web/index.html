<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VO 评估系统</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>VO 评估系统</h1>
        <p>浏览器内完成轨迹解析、指标计算和可视化；上传的数据不会离开当前浏览器。</p>
      </div>
      <div id="runtimeStatus" class="status">加载 Python 运行环境...</div>
    </header>

    <main class="layout">
      <aside class="panel controls" aria-label="评估设置">
        <section>
          <h2>输入文件</h2>
          <label>
            Ground truth
            <input id="gtFile" type="file" accept=".txt,.csv,.tsv,.log" />
          </label>
          <label>
            VO 输出
            <input id="estFile" type="file" accept=".txt,.csv,.tsv,.log" />
          </label>
        </section>

        <section>
          <h2>格式与对齐</h2>
          <label>
            Ground truth 格式
            <select id="gtFormat">
              <option value="auto">自动识别</option>
              <option value="tum">TUM</option>
              <option value="kitti">KITTI</option>
              <option value="csv">CSV/TSV 表格</option>
              <option value="xyz">XYZ</option>
            </select>
          </label>
          <label>
            VO 输出格式
            <select id="estFormat">
              <option value="auto">自动识别</option>
              <option value="tum">TUM</option>
              <option value="kitti">KITTI</option>
              <option value="csv">CSV/TSV 表格</option>
              <option value="xyz">XYZ</option>
            </select>
          </label>
          <label>
            轨迹对齐
            <select id="alignment">
              <option value="sim3">Sim3 相似变换</option>
              <option value="se3">SE3 刚体对齐</option>
              <option value="first_pose">首帧对齐</option>
              <option value="none">不对齐</option>
            </select>
          </label>
        </section>

        <section>
          <h2>评估参数</h2>
          <label>
            时间关联最大误差 s（不按时间填 -1）
            <input id="maxTimeDiff" type="number" value="0.02" step="0.01" />
          </label>
          <label>
            VO 时间戳偏移 s
            <input id="timeOffset" type="number" value="0" step="0.01" />
          </label>
          <label>
            RPE 固定帧间隔 Δ
            <input id="rpeDelta" type="number" value="1" min="1" step="1" />
          </label>
          <label>
            长航程子轨迹长度 m
            <input id="segmentLengths" type="text" value="50,100,200,500,1000,2000,5000" />
          </label>
          <label>
            每个长度最多抽样段数
            <input id="maxSegments" type="number" value="10000" min="100" step="1000" />
          </label>
          <label>
            子轨迹起点步长 frames
            <input id="segmentStep" type="number" value="10" min="1" step="1" />
          </label>
          <label>
            子轨迹长度容差比例
            <input id="lengthTolerance" type="number" value="0.2" min="0" max="1" step="0.05" />
          </label>
        </section>

        <section>
          <h2>诊断阈值</h2>
          <label>
            VO 重置/断点处理
            <select id="segmentPolicy">
              <option value="vo_timestamps">按 VO 时间戳统一评估</option>
              <option value="segments">按 VO 连续段逐段评估</option>
              <option value="longest">只评估最长连续段</option>
            </select>
          </label>
          <label>
            断点步长阈值 m
            <input id="discontinuityStep" type="number" value="100" min="0" step="10" />
          </label>
          <label>
            断点时间间隔阈值 s
            <input id="discontinuityGap" type="number" value="5" min="0" step="1" />
          </label>
          <label>
            发散绝对阈值 m
            <input id="divergenceAbs" type="number" value="10" min="0" step="1" />
          </label>
          <label>
            发散相对阈值 % 路程
            <input id="divergenceRel" type="number" value="2" min="0" step="0.5" />
          </label>
        </section>

        <button id="runButton" disabled>运行评估</button>
      </aside>

      <section class="content">
        <div id="message" class="message" hidden></div>

        <section class="panel">
          <h2>运行结果</h2>
          <div id="metrics" class="metric-grid">
            <div class="empty-state">上传 Ground truth 和 VO 输出后运行评估。</div>
          </div>
        </section>

        <section class="panel">
          <h2>可视化</h2>
          <div class="chart-grid">
            <div id="trajectory3d" class="chart"></div>
            <div id="trajectoryXY" class="chart"></div>
            <div id="errorDistance" class="chart"></div>
            <div id="altitudeDistance" class="chart"></div>
            <div id="segmentError" class="chart"></div>
            <div id="speedError" class="chart"></div>
          </div>
        </section>

        <section class="panel">
          <h2>导出</h2>
          <div class="downloads">
            <button id="downloadJson" disabled>下载 JSON 指标</button>
            <button id="downloadPoseCsv" disabled>下载每帧误差 CSV</button>
            <button id="downloadSegmentCsv" disabled>下载子轨迹误差 CSV</button>
            <button id="downloadHtml" disabled>下载 HTML 报告</button>
          </div>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
